---
- name: Scan VMs for CIS misconfigurations
  hosts: vms
  become: true
  tasks:
    - name: Get full sshd effective config
      ansible.builtin.command: sshd -T
      register: sshd_config_output
      changed_when: false

    - name: Get ufw firewall status
      ansible.builtin.command: ufw status
      register: ufw_status_output
      changed_when: false

    - name: Get unattended-upgrades service status
      ansible.builtin.command: systemctl is-enabled unattended-upgrades
      register: unattended_upgrades_output
      changed_when: false
      failed_when: false

    - name: Get PASS_MAX_DAYS from login.defs
      ansible.builtin.shell: grep -E "^PASS_MAX_DAYS" /etc/login.defs | awk '{print $2}'
      register: pass_max_days_output
      changed_when: false

    - name: Get file permissions for /etc/passwd and /etc/shadow
      ansible.builtin.shell: |
        echo "passwd:$(stat -c '%a' /etc/passwd)"
        echo "shadow:$(stat -c '%a' /etc/shadow)"
      register: file_perms_output
      changed_when: false

    - name: Get fs.suid_dumpable sysctl value
      ansible.builtin.command: sysctl -n fs.suid_dumpable
      register: suid_dumpable_output
      changed_when: false

    - name: Extract relevant settings into a clean fact
      ansible.builtin.set_fact:
        scan_result:
          hostname: "{{ inventory_hostname }}"
          permit_root_login: "{{ sshd_config_output.stdout_lines | select('match', '^permitrootlogin') | first }}"
          password_authentication: "{{ sshd_config_output.stdout_lines | select('match', '^passwordauthentication') | first }}"
          max_auth_tries: "{{ sshd_config_output.stdout_lines | select('match', '^maxauthtries') | first }}"
          x11_forwarding: "{{ sshd_config_output.stdout_lines | select('match', '^x11forwarding') | first }}"
          permit_empty_passwords: "{{ sshd_config_output.stdout_lines | select('match', '^permitemptypasswords') | first }}"
          ignore_rhosts: "{{ sshd_config_output.stdout_lines | select('match', '^ignorerhosts') | first }}"
          client_alive_interval: "{{ sshd_config_output.stdout_lines | select('match', '^clientaliveinterval') | first }}"
          ufw_status: "{{ ufw_status_output.stdout_lines[0] }}"
          unattended_upgrades: "{{ unattended_upgrades_output.stdout | trim }}"
          pass_max_days: "{{ pass_max_days_output.stdout | trim }}"
          login_grace_time: "{{ sshd_config_output.stdout_lines | select('match', '^logingracetime') | first }}"
          log_level: "{{ sshd_config_output.stdout_lines | select('match', '^loglevel') | first }}"
          passwd_perms: "{{ file_perms_output.stdout_lines[0].split(':')[1] }}"
          shadow_perms: "{{ file_perms_output.stdout_lines[1].split(':')[1] }}"
          suid_dumpable: "{{ suid_dumpable_output.stdout | trim }}"

    - name: Show the clean scan result
      ansible.builtin.debug:
        var: scan_result

    - name: Save scan result as JSON file
      ansible.builtin.copy:
        content: "{{ scan_result | to_nice_json }}"
        dest: "{{ playbook_dir }}/../scan_results/{{ inventory_hostname }}.json"
      delegate_to: localhost
      become: false
