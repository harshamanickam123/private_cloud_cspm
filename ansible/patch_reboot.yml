---
- name: Reboot selected VM and verify recovery
  hosts: vms
  gather_facts: false
  become: true

  tasks:
    - name: Reboot the selected VM and wait for it to return
      ansible.builtin.reboot:
        reboot_timeout: 600
        connect_timeout: 10
        post_reboot_delay: 10
        test_command: whoami
      register: reboot_result

    - name: Wait until the VM is reachable through Ansible
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Check whether the reboot-required marker still exists
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_marker

    - name: Save reboot verification result on controller
      ansible.builtin.copy:
        dest: "{{ patch_output_dir }}/{{ inventory_hostname }}.json"
        mode: "0600"
        content: "{{ {
          'vm_name': inventory_hostname,
          'reboot_succeeded': true,
          'reboot_required': reboot_marker.stat.exists | default(false),
          'reboot_verified': true
        } | to_nice_json }}"
      delegate_to: localhost
      become: false
